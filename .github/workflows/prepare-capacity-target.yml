name: Prepare isolated recovery capacity schema

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full reviewed current main SHA
        required: true
      mode:
        description: Rehearse only or rehearse then install schema
        type: choice
        options: [rehearse, install]
        default: rehearse
      confirmation:
        description: Type PREPARE_RECOVERY_SCHEMA_ONLY
        required: true

permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PREPARE_RECOVERY_SCHEMA_ONLY'
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}

  prepare:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CI: true
      SAFEBUS_CAPACITY_CONFIRM: ${{ inputs.confirmation }}
      SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
    steps:
      - name: Validate SHA before checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install native PostgreSQL 17 tools without Docker
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --silent --show-error --fail --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          source /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: amd64\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Rehearse schema import and verify rollback
        env:
          SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
          SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
          SAFEBUS_CAPACITY_DATABASE_URL: ${{ secrets.SAFEBUS_CAPACITY_DATABASE_URL }}
          SAFEBUS_CAPACITY_DATABASE_CA_CERT: ${{ vars.SAFEBUS_CAPACITY_DATABASE_CA_CERT }}
          SAFEBUS_CAPACITY_MODE: rehearse
        run: node scripts/prepare-capacity-target.mjs
      - name: Install only after successful rehearsal
        if: inputs.mode == 'install'
        env:
          SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
          SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
          SAFEBUS_CAPACITY_DATABASE_URL: ${{ secrets.SAFEBUS_CAPACITY_DATABASE_URL }}
          SAFEBUS_CAPACITY_DATABASE_CA_CERT: ${{ vars.SAFEBUS_CAPACITY_DATABASE_CA_CERT }}
          SAFEBUS_CAPACITY_MODE: install
        run: node scripts/prepare-capacity-target.mjs
      - name: Retain hashes and scope evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: capacity-schema-${{ github.run_id }}
          path: .safebus-release/capacity-bootstrap/*.json
          retention-days: 7
          if-no-files-found: error
