name: Release district agreement database

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed current main SHA (40 characters)
        required: true
      mode:
        type: choice
        options: [rehearse, install]
        required: true
      confirmation:
        description: REHEARSE_DISTRICT_AGREEMENTS or INSTALL_DISTRICT_AGREEMENTS
        required: true
      backup_run_id:
        description: Successful recent protected encrypted backup workflow run ID (install only)
        required: false
      rehearsal_run_id:
        description: Successful recent read-only rehearsal workflow run ID (install only)
        required: false
      recovery_confirmation:
        description: RESTORE_VERIFIED_OFFSITE after independent recovery/backup review (install only)
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.git_ref == github.sha &&
      ((inputs.mode == 'rehearse' && inputs.confirmation == 'REHEARSE_DISTRICT_AGREEMENTS') ||
       (inputs.mode == 'install' && inputs.confirmation == 'INSTALL_DISTRICT_AGREEMENTS'))
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}

  release:
    needs: validate
    name: Protected district agreement schema release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CI: true
      SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_AGREEMENT_CONFIRM: ${{ inputs.confirmation }}
      SAFEBUS_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      SAFEBUS_REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
      SAFEBUS_RECOVERY_CONFIRM: ${{ inputs.recovery_confirmation }}
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify reviewed SQL in isolated PostgreSQL without production credentials
        run: node --test tests/release/district-agreement-postgres-replay.test.mjs
      - name: Rehearse read-only or install after fresh evidence and explicit authorization
        run: node scripts/release-district-agreements.mjs ${{ inputs.mode }}
      - name: Retain sanitized installation or rehearsal result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: district-agreements-${{ inputs.mode }}-${{ inputs.git_ref }}-${{ github.run_id }}
          path: .safebus-release/district-agreements/
          retention-days: 90
          if-no-files-found: error
