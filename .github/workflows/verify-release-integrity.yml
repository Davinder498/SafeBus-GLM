name: Verify production release integrity read-only

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed current main SHA
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}

  verify:
    needs: validate
    name: Protected read-only release integrity verification
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DEPLOY_ENV: production
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Validate exact reviewed main SHA before checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Require exact clean reviewed checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify manifest, registered drift, schema preflight, types and authorization
        run: |
          pnpm migrations:verify
          pnpm migrations:drift
          pnpm migrations:preflight
          pnpm types:check
          pnpm authorization:audit
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Record metadata-only verification evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { sha256 } from './scripts/lib/migrations.mjs';
          import { createEnvironmentBinding } from './scripts/lib/environment-identity.mjs';
          import { readObservedContract, contractDigest } from './scripts/lib/observed-production-baseline.mjs';
          const contract = await readObservedContract();
          const evidence = {
            format: 1,
            mode: 'read-only-release-integrity-verification',
            releaseSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            ...createEnvironmentBinding({
              environment: 'production',
              databaseUrl: process.env.SAFEBUS_DATABASE_URL,
              supabaseUrl: process.env.SUPABASE_URL,
            }),
            observedBaselineContractSha256: contractDigest(contract),
            baselineSchemaFingerprint: contract.schemaFingerprint,
            migrationManifestSha256: sha256(await fs.readFile('supabase/migration-checksums.json')),
            canonicalTypesSha256: sha256(await fs.readFile('packages/types/src/database.generated.ts')),
            gates: Object.fromEntries([
              'migration_manifest', 'migration_drift', 'schema_preflight',
              'canonical_database_types', 'authorization_audit',
            ].map(gate => [gate, 'passed'])),
            databaseWritesPerformed: false,
            applicationDeploymentPerformed: false,
            historicalExecutionsClaimed: false,
            createdAt: new Date().toISOString(),
          };
          const directory = '.safebus-release/integrity-verification';
          await fs.mkdir(directory, { recursive: true });
          await fs.writeFile(directory + '/evidence.json', JSON.stringify(evidence, null, 2) + '\n', { mode: 0o600 });
          console.log('PASS: registered drift, preflight, canonical types and authorization; read-only verification.');
          NODE
      - name: Retain restricted verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-integrity-verification-${{ github.sha }}
          path: .safebus-release/integrity-verification/
          retention-days: 90
          if-no-files-found: error
