name: Release production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character reviewed commit SHA
        required: true
      confirmation:
        description: Type DEPLOY_PRODUCTION
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirmation == 'DEPLOY_PRODUCTION'
    name: Human-approved production release
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: true
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_DEPLOY_CONFIRM: DEPLOY_PRODUCTION
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
      - name: Resolve approved release SHA
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          echo "SAFEBUS_RELEASE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Preflight exact commit without changing the database
        run: pnpm release:preflight
      - name: Verify no schema change is pending and record the release
        run: pnpm migrations:deploy
      - name: Deploy the preflighted production artifact
        run: pnpm exec netlify deploy --prod --dir apps/web/dist --message "$SAFEBUS_RELEASE_SHA"
      - name: Store release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-release-${{ env.SAFEBUS_RELEASE_SHA }}
          path: |
            apps/web/dist
            .safebus-release/preflight.json
            supabase/migration-checksums.json
            packages/types/src/database.generated.ts
          retention-days: 90
