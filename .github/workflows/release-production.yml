name: Release production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character reviewed commit SHA
        required: true
      confirmation:
        description: Type DEPLOY_PRODUCTION
        required: true
      pilot_confirmation:
        description: Type AUTHORIZE_CR1_PILOT
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirmation == 'DEPLOY_PRODUCTION' && inputs.pilot_confirmation == 'AUTHORIZE_CR1_PILOT'
    name: Human-approved production release
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: true
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_DEPLOY_CONFIRM: DEPLOY_PRODUCTION
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Resolve approved release SHA
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          echo "SAFEBUS_RELEASE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify unified notification database support before releasing clients and email
        env:
          SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
          SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SAFEBUS_OPERATIONAL_MILESTONE: delivery
        run: node scripts/release-operational-fix.mjs verify
      - name: Verify active Point 6 privacy and legal approval
        run: pnpm privacy:verify
      - name: Verify active Point 8 map readiness
        run: pnpm map:verify
      - name: Verify active Point 9 operational readiness
        run: pnpm operations:verify
      - name: Verify active CR1 pilot authorization
        run: pnpm pilot:verify
      - run: pnpm exec playwright install --with-deps chromium
      - name: Preflight exact commit without changing the database
        env:
          SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
          SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm release:preflight
      - name: Verify no schema change is pending and record the release
        env:
          SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
          SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
        run: pnpm migrations:deploy
      - name: Deploy the preflighted production artifact
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: pnpm exec netlify deploy --prod --no-build --context production --filter @safebus/web --dir apps/web/dist --message "$SAFEBUS_RELEASE_SHA"
      - name: Store release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-release-${{ env.SAFEBUS_RELEASE_SHA }}
          path: |
            apps/web/dist
            .safebus-release/preflight.json
            docs/governance/pilot-authorization.json
            docs/governance/privacy-readiness.json
            docs/governance/map-readiness.json
            docs/governance/operations-readiness.json
            supabase/migration-checksums.json
            packages/types/src/database.generated.ts
          retention-days: 90
