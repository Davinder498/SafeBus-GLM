name: Release production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Staging-approved immutable commit SHA or tag
        required: true
      confirmation:
        description: Type DEPLOY_PRODUCTION
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirmation == 'DEPLOY_PRODUCTION'
    name: Human-approved production release
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: true
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_DEPLOY_CONFIRM: DEPLOY_PRODUCTION
      SAFEBUS_RELEASE_SHA: ${{ github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
      - name: Resolve approved release SHA
        run: echo "SAFEBUS_RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrations:verify
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm security:audit
      - name: Deploy forward-only schema changes
        run: pnpm migrations:deploy
      - name: Verify production types
        run: pnpm types:check
      - run: pnpm build
      - name: Reject public source maps
        run: test -z "$(find apps -path '*/dist/*' -name '*.map' -print -quit)"
      - name: Deploy production application
        run: pnpm exec netlify deploy --prod --dir apps/web/dist --message "$SAFEBUS_RELEASE_SHA"
