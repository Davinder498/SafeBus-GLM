name: Rehearse existing-project security changes

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character reviewed commit SHA
        required: true
      confirmation:
        description: Type REHEARSE_EXISTING_SECURITY_ROLLBACK_ONLY
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.confirmation == 'REHEARSE_EXISTING_SECURITY_ROLLBACK_ONLY'
    name: Validate reviewed code without database credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - name: Validate reviewed SHA syntax before checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Require exact reviewed checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          git merge-base --is-ancestor "$ACTUAL_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate code before database rehearsal
        run: |
          pnpm migrations:verify
          pnpm typecheck
          pnpm lint
          pnpm build
          pnpm test
      - name: Report files regenerated by validation
        run: git status --short --untracked-files=no

  rehearse:
    needs: validate
    if: inputs.confirmation == 'REHEARSE_EXISTING_SECURITY_ROLLBACK_ONLY'
    name: Protected rollback-only security rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CI: true
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_REHEARSAL_API_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SAFEBUS_REHEARSAL_CONFIRM: ${{ inputs.confirmation }}
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - name: Validate reviewed SHA syntax before checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Require exact reviewed checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          git merge-base --is-ancestor "$ACTUAL_SHA" origin/main
          echo "SAFEBUS_RELEASE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile and check security inside one rollback-only transaction
        run: node scripts/rehearse-existing-security.mjs
      - name: Store restricted catalog and rollback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: existing-security-rehearsal-${{ env.SAFEBUS_RELEASE_SHA }}
          path: .safebus-release/existing-security-rehearsal/
          retention-days: 7
