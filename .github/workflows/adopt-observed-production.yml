name: Register reviewed observed production baseline

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed current main SHA
        required: true
      mode:
        type: choice
        options: [rehearse, adopt]
        required: true
      confirmation:
        description: REHEARSE_OBSERVED_BASELINE_ROLLBACK_ONLY or ADOPT_OBSERVED_BASELINE_METADATA_ONLY
        required: true
      backup_run_id:
        description: Fresh encrypted post-security backup run (adopt only)
        required: false
      rehearsal_run_id:
        description: Successful matching rollback rehearsal run (adopt only)
        required: false
      recovery_receipt_sha256:
        description: Human-verified post-security full restore receipt digest (adopt only)
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}

  register:
    needs: validate
    name: Protected observed baseline rehearsal or registration
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DEPLOY_ENV: production
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SAFEBUS_REHEARSAL_API_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
      SAFEBUS_OBSERVED_MODE: ${{ inputs.mode }}
      SAFEBUS_OBSERVED_CONFIRM: ${{ inputs.confirmation }}
      SAFEBUS_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      SAFEBUS_REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
      SAFEBUS_RECOVERY_RECEIPT_SHA256: ${{ inputs.recovery_receipt_sha256 }}
      SAFEBUS_SECURITY_RECOVERY_RECEIPT: ${{ secrets.SAFEBUS_SECURITY_RECOVERY_RECEIPT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate exact reviewed main SHA before checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Require exact clean reviewed checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
          echo "SAFEBUS_RELEASE_SHA=$REQUESTED_SHA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require canonical hosted type equality before metadata operation
        run: pnpm types:check
      - name: Rehearse or register only reviewed release metadata
        run: node scripts/adopt-observed-production.mjs
      - name: Retain restricted registration outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: observed-production-baseline-${{ env.SAFEBUS_RELEASE_SHA }}
          path: .safebus-release/observed-production-baseline/
          retention-days: 90
          if-no-files-found: ignore
