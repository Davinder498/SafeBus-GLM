name: Build signed Android release

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character reviewed commit SHA
        required: true
      confirmation:
        description: Type RELEASE_ANDROID
        required: true

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirmation == 'RELEASE_ANDROID'
    name: Human-approved signed Android bundle
    runs-on: ubuntu-latest
    environment: android-production
    env:
      CI: true
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SAFEBUS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SAFEBUS_ANDROID_KEYSTORE_PASSWORD }}
      SAFEBUS_ANDROID_KEY_ALIAS: ${{ secrets.SAFEBUS_ANDROID_KEY_ALIAS }}
      SAFEBUS_ANDROID_KEY_PASSWORD: ${{ secrets.SAFEBUS_ANDROID_KEY_PASSWORD }}
      SAFEBUS_ANDROID_VERSION_CODE: ${{ github.run_number }}
      SAFEBUS_ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
      - name: Resolve approved release SHA
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          echo "SAFEBUS_RELEASE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Materialize protected signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.SAFEBUS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$SAFEBUS_ANDROID_KEYSTORE_PASSWORD"
          test -n "$SAFEBUS_ANDROID_KEY_ALIAS"
          test -n "$SAFEBUS_ANDROID_KEY_PASSWORD"
          SAFEBUS_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/safebus-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SAFEBUS_ANDROID_KEYSTORE_PATH"
          chmod 600 "$SAFEBUS_ANDROID_KEYSTORE_PATH"
          echo "SAFEBUS_ANDROID_KEYSTORE_PATH=$SAFEBUS_ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - run: pnpm --filter @safebus/mobile build
      - run: pnpm --filter @safebus/mobile cap:sync
      - name: Test and build signed application bundle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease bundleRelease
      - name: Verify bundle signature
        run: |
          SIGNATURE_OUTPUT="$(jarsigner -verify -verbose -certs apps/mobile/android/app/build/outputs/bundle/release/app-release.aab 2>&1)"
          printf '%s\n' "$SIGNATURE_OUTPUT"
          printf '%s\n' "$SIGNATURE_OUTPUT" | grep -q "jar verified."
          if printf '%s\n' "$SIGNATURE_OUTPUT" | grep -qi "jar is unsigned"; then
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: safebus-android-${{ env.SAFEBUS_RELEASE_SHA }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
