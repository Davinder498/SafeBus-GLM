name: Build signed Android release

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character reviewed commit SHA
        required: true
      version_code:
        description: Monotonically increasing Play version code (first release is 1)
        required: true
      version_name:
        description: Public semantic version name (first release is 1.0.0)
        required: true
      confirmation:
        description: Type RELEASE_ANDROID
        required: true

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirmation == 'RELEASE_ANDROID'
    name: Human-approved signed Android bundle
    runs-on: ubuntu-latest
    environment: android-production
    env:
      CI: true
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SAFEBUS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SAFEBUS_ANDROID_KEYSTORE_PASSWORD }}
      SAFEBUS_ANDROID_KEY_ALIAS: ${{ secrets.SAFEBUS_ANDROID_KEY_ALIAS }}
      SAFEBUS_ANDROID_KEY_PASSWORD: ${{ secrets.SAFEBUS_ANDROID_KEY_PASSWORD }}
      SAFEBUS_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      SAFEBUS_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      SAFEBUS_REQUIRE_RELEASE_SIGNING: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
      - name: Resolve approved release SHA
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          echo "SAFEBUS_RELEASE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - name: Validate explicit release inputs and public configuration
        run: |
          printf '%s' "$SAFEBUS_RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s' "$SAFEBUS_ANDROID_VERSION_CODE" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$SAFEBUS_ANDROID_VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # The legacy SDK package 'tools' is no longer available.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:publication:verify
      - name: Materialize protected signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.SAFEBUS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$SAFEBUS_ANDROID_KEYSTORE_PASSWORD"
          test -n "$SAFEBUS_ANDROID_KEY_ALIAS"
          test -n "$SAFEBUS_ANDROID_KEY_PASSWORD"
          SAFEBUS_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/safebus-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SAFEBUS_ANDROID_KEYSTORE_PATH"
          chmod 600 "$SAFEBUS_ANDROID_KEYSTORE_PATH"
          echo "SAFEBUS_ANDROID_KEYSTORE_PATH=$SAFEBUS_ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Materialize protected Firebase Android configuration
        env:
          FIREBASE_GOOGLE_SERVICES_BASE64: ${{ secrets.SAFEBUS_FIREBASE_GOOGLE_SERVICES_BASE64 }}
        run: |
          test -n "$FIREBASE_GOOGLE_SERVICES_BASE64"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_BASE64" | base64 --decode > apps/mobile/android/app/google-services.json
          chmod 600 apps/mobile/android/app/google-services.json
          node -e "const c=require('./apps/mobile/android/app/google-services.json');const ok=c.project_info?.project_id&&c.client?.some(x=>x.client_info?.android_client_info?.package_name==='com.safebusalberta.app');if(!ok)process.exit(1)"
      - run: pnpm --filter @safebus/mobile build
      - run: pnpm --filter @safebus/mobile cap:sync
      - name: Test and build signed application bundle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease bundleRelease
      - name: Verify bundle signature
        run: |
          AAB_PATH="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          SIGNATURE_OUTPUT="$RUNNER_TEMP/aab-signature-verification.txt"
          jarsigner -verify -verbose -certs "$AAB_PATH" > "$SIGNATURE_OUTPUT" 2>&1
          grep -q "jar verified." "$SIGNATURE_OUTPUT"
          if grep -qi "jar is unsigned" "$SIGNATURE_OUTPUT"; then
            exit 1
          fi
          CERTIFICATE_PEM="$RUNNER_TEMP/aab-signing-certificate.pem"
          keytool -printcert -jarfile "$AAB_PATH" -rfc |
            sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > "$CERTIFICATE_PEM"
          test -s "$CERTIFICATE_PEM"
          SIGNING_CERT_SHA256="$(openssl x509 -in "$CERTIFICATE_PEM" -outform DER | sha256sum | cut -d ' ' -f 1)"
          printf '%s' "$SIGNING_CERT_SHA256" | grep -Eq '^[a-f0-9]{64}$'
          echo "SAFEBUS_ANDROID_SIGNING_CERT_SHA256=$SIGNING_CERT_SHA256" >> "$GITHUB_ENV"
      - name: Create source-bound Android provenance
        run: |
          node scripts/create-android-release-manifest.mjs \
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            apps/mobile/android/app/build/outputs/bundle/release/safebus-android-provenance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: safebus-android-${{ env.SAFEBUS_RELEASE_SHA }}
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile/android/app/build/outputs/bundle/release/safebus-android-provenance.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove materialized Firebase configuration
        if: always()
        run: rm -f apps/mobile/android/app/google-services.json
