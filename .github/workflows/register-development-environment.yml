name: Register development database identity

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character approved commit SHA
        required: true
      confirmation:
        description: Type REGISTER_DEVELOPMENT
        required: true

permissions:
  contents: read

concurrency:
  group: development-environment-registration
  cancel-in-progress: false

jobs:
  register:
    if: inputs.confirmation == 'REGISTER_DEVELOPMENT'
    name: Register isolated development database
    runs-on: ubuntu-latest
    environment: development
    env:
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_REGISTER_CONFIRM: ${{ inputs.confirmation }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
      - name: Require exact approved commit
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          echo "SAFEBUS_RELEASE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm environment:register-development
      - uses: actions/upload-artifact@v7
        with:
          name: development-registration-${{ env.SAFEBUS_RELEASE_SHA }}
          path: .safebus-release/development-registration.json
          retention-days: 30
