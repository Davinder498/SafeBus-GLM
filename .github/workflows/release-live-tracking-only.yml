name: Release live tracking without GPS history
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed current main SHA
        required: true
      mode:
        type: choice
        options: [rehearse, install]
        required: true
      confirmation:
        description: REHEARSE_GPS_HISTORY_REMOVAL or REMOVE_GPS_HISTORY
        required: true
      recovery_run_id:
        description: Successful platform recovery export for this SHA within 24 hours (install)
        required: false
      recovery_confirmation:
        description: RESTORE_VERIFIED_OFFSITE after independent backup and restore review (install)
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && ((inputs.mode == 'rehearse' && inputs.confirmation == 'REHEARSE_GPS_HISTORY_REMOVAL') || (inputs.mode == 'install' && inputs.confirmation == 'REMOVE_GPS_HISTORY'))
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}
      SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_TRACKING_REMOVAL_MODE: ${{ inputs.mode }}
      SAFEBUS_TRACKING_REMOVAL_CONFIRM: ${{ inputs.confirmation }}
      SAFEBUS_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
      SAFEBUS_RECOVERY_CONFIRM: ${{ inputs.recovery_confirmation }}
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
      SAFEBUS_BACKUP_PUBLIC_KEY: ${{ vars.SAFEBUS_BACKUP_PUBLIC_KEY }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 17 recovery tools without Docker
        if: inputs.mode == 'install'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --silent --show-error --fail --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          source /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: amd64\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Reconcile and rehearse; capture encrypted recovery for installation
        id: prepare
        run: node scripts/release-live-tracking-only.mjs prepare
      - name: Retain exact recovery before dropping history
        if: steps.prepare.outputs.state == 'pending'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-tracking-recovery-${{ inputs.git_ref }}-${{ github.run_id }}
          path: .safebus-release/live-tracking-only/
          retention-days: 7
          if-no-files-found: error
      - name: Remove GPS history after verifying exact recovery
        if: inputs.mode == 'install' && steps.prepare.outputs.state == 'pending'
        run: node scripts/release-live-tracking-only.mjs install
      - name: Verify live schema and expiry job
        if: inputs.mode == 'install'
        run: node scripts/release-live-tracking-only.mjs verify
      - name: Retire the empty GPS archive bucket through the Storage API
        if: inputs.mode == 'install'
        run: node scripts/release-live-tracking-only.mjs cleanup
      - name: Retain sanitized outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-tracking-outcome-${{ inputs.git_ref }}-${{ github.run_id }}
          path: |
            .safebus-release/live-tracking-only/rehearsal.json
            .safebus-release/live-tracking-only/installation.json
            .safebus-release/live-tracking-only/verification.json
            .safebus-release/live-tracking-only/existing.json
            .safebus-release/live-tracking-only/archive-bucket.json
          retention-days: 90
          if-no-files-found: ignore
