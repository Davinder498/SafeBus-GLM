name: Roll back release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        type: choice
        options: [production]
        required: true
      known_good_ref:
        description: Previously approved commit SHA or immutable tag
        required: true
      confirmation:
        description: Type ROLLBACK_PRODUCTION
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.environment }}-release
  cancel-in-progress: false

jobs:
  rollback-app:
    name: Restore known-good application
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CI: true
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Validate explicit rollback confirmation
        env:
          ACTUAL_CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          KNOWN_GOOD_SHA: ${{ inputs.known_good_ref }}
        run: |
          expected="ROLLBACK_$(printf '%s' "$TARGET_ENVIRONMENT" | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_CONFIRMATION" = "$expected"
          [[ "$KNOWN_GOOD_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.known_good_ref }}
          fetch-depth: 0
      - name: Require immutable commit reference
        env:
          KNOWN_GOOD_SHA: ${{ inputs.known_good_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$KNOWN_GOOD_SHA"
          git merge-base --is-ancestor "$KNOWN_GOOD_SHA" origin/main
          git rev-parse HEAD
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm security:audit
      - run: pnpm build
      - name: Reject public source maps
        run: test -z "$(find apps -path '*/dist/*' -name '*.map' -print -quit)"
      - name: Restore known-good application artifact
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: pnpm exec netlify deploy --prod --no-build --filter @safebus/web --dir apps/web/dist --message "rollback-to-$(git rev-parse HEAD)"
