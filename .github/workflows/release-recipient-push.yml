name: Release recipient-controlled push delivery

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed current main commit SHA
        required: true
      mode:
        type: choice
        options: [rehearse, install]
        required: true
      confirmation:
        description: REHEARSE_RECIPIENT_PUSH or INSTALL_RECIPIENT_PUSH
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && ((inputs.mode == 'install' && inputs.confirmation == 'INSTALL_RECIPIENT_PUSH') || (inputs.mode == 'rehearse' && inputs.confirmation == 'REHEARSE_RECIPIENT_PUSH'))
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}

  release:
    needs: validate
    name: Protected bounded notification rollout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CI: true
      SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_NOTIFICATION_CONFIRM: ${{ inputs.confirmation }}
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
      SAFEBUS_BACKUP_PUBLIC_KEY: ${{ vars.SAFEBUS_BACKUP_PUBLIC_KEY }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deployment credential before any database change
        run: node scripts/verify-push-deployment-access.mjs
      - name: Capture recovery and rehearse only the bounded forward change
        run: node scripts/release-recipient-push.mjs prepare
      - name: Retain encrypted recovery before persistent changes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recipient-push-recovery-${{ inputs.git_ref }}-${{ github.run_id }}
          path: .safebus-release/recipient-push/
          retention-days: 90
          if-no-files-found: error
      - name: Deploy the reviewed sender and its validation-only endpoint
        if: inputs.mode == 'install'
        run: pnpm exec supabase functions deploy push-notification-dispatcher --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
      - name: Validate Firebase credentials and a registered device without sending
        if: inputs.mode == 'install'
        run: node scripts/verify-push-provider.mjs
      - name: Remove authority switches atomically after verified recovery and provider readiness
        if: inputs.mode == 'install'
        run: node scripts/release-recipient-push.mjs install
      - name: Retain sanitized outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recipient-push-outcome-${{ inputs.git_ref }}-${{ github.run_id }}
          path: .safebus-release/recipient-push/installation.json
          retention-days: 90
          if-no-files-found: ignore
