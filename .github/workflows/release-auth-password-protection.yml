name: Release Auth password protection
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed current main commit SHA
        required: true
      mode:
        type: choice
        options: [inspect, enable]
        required: true
      confirmation:
        description: INSPECT_AUTH_SECURITY or ENABLE_LEAKED_PASSWORD_PROTECTION
        required: true
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && ((inputs.mode == 'inspect' && inputs.confirmation == 'INSPECT_AUTH_SECURITY') || (inputs.mode == 'enable' && inputs.confirmation == 'ENABLE_LEAKED_PASSWORD_PROTECTION'))
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CI: true
      SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_AUTH_SECURITY_CONFIRM: ${{ inputs.confirmation }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read and record only the prior protection boolean
        run: node scripts/release-auth-password-protection.mjs prepare
      - name: Retain before-state before changing Auth
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: auth-password-before-${{ inputs.git_ref }}-${{ github.run_id }}
          path: .safebus-release/auth-password-protection/before.json
          retention-days: 90
          if-no-files-found: error
      - name: Enable only leaked-password protection
        if: inputs.mode == 'enable'
        run: node scripts/release-auth-password-protection.mjs enable
      - name: Verify hosted Auth protection
        if: inputs.mode == 'enable'
        run: node scripts/release-auth-password-protection.mjs verify
      - name: Retain non-secret outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: auth-password-outcome-${{ inputs.git_ref }}-${{ github.run_id }}
          path: |
            .safebus-release/auth-password-protection/installation.json
            .safebus-release/auth-password-protection/verification.json
          retention-days: 90
          if-no-files-found: ignore
