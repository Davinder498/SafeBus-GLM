name: Validate security installation code

on:
  workflow_call:
    inputs:
      git_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - name: Validate reviewed SHA syntax before checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Require exact reviewed checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          git merge-base --is-ancestor "$ACTUAL_SHA" origin/main
          echo "SAFEBUS_RELEASE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate code without database credentials
        run: |
          pnpm migrations:verify
          pnpm typecheck
          pnpm lint
          pnpm build
          pnpm test
      - run: git status --short --untracked-files=no
