name: Authorization audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-authorization-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only production authorization audit
    runs-on: ubuntu-latest
    environment: production
    env:
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DEPLOY_ENV: production
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run catalog and Data API authorization checks without writes
        run: pnpm authorization:audit
