name: Authorization audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-authorization-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only production authorization audit
    runs-on: ubuntu-latest
    environment: production
    env:
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DEPLOY_ENV: production
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run catalog and Data API authorization checks without writes
        run: pnpm authorization:audit
