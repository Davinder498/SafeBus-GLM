name: Check isolated recovery Auth
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full reviewed current main SHA
        required: true
      confirmation:
        description: Type CHECK_RECOVERY_AUTH
        required: true
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'CHECK_RECOVERY_AUTH'
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}
  install:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Verify exact main revision
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify disposable recovery Auth accounts
        env:
          SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
          SAFEBUS_CAPACITY_CONFIRM: ${{ inputs.confirmation }}
          SAFEBUS_CAPACITY_DATABASE_URL: ${{ secrets.SAFEBUS_CAPACITY_DATABASE_URL }}
          SAFEBUS_CAPACITY_AUTH_SECRET: ${{ secrets.SAFEBUS_CAPACITY_AUTH_SECRET }}
          SAFEBUS_CAPACITY_PUBLISHABLE_KEY: ${{ vars.SAFEBUS_CAPACITY_PUBLISHABLE_KEY }}
          SAFEBUS_CAPACITY_DATABASE_CA_CERT: ${{ vars.SAFEBUS_CAPACITY_DATABASE_CA_CERT }}
        run: node scripts/check-recovery-auth.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recovery-auth-${{ github.run_id }}
          path: .safebus-release/recovery-auth/evidence.json
          retention-days: 7
          if-no-files-found: error
