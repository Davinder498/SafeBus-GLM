name: Deploy push dispatcher

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character reviewed commit SHA already merged to main
        required: true
      confirmation:
        description: Type DEPLOY_PUSH_DISPATCHER
        required: true

permissions:
  contents: read

concurrency:
  group: production-push-dispatcher
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'DEPLOY_PUSH_DISPATCHER'
    name: Human-approved Supabase function deployment
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: true
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Verify the reviewed SHA is merged to main
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          test "$(printf '%s' "$REQUESTED_SHA" | wc -c)" -eq 40
          git fetch origin main
          git merge-base --is-ancestor "$ACTUAL_SHA" origin/main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify protected Supabase deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
      - name: Re-run dispatcher and release contract tests
        run: pnpm --filter @safebus/web test -- push-notification-dispatcher && node --test tests/release/notification-system-contract.test.mjs tests/release/security-config.test.mjs
      - name: Deploy only the reviewed push dispatcher
        run: pnpm exec supabase functions deploy push-notification-dispatcher --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
