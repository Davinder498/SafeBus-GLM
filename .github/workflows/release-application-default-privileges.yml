name: Release application default privilege repair
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed current main SHA
        required: true
      mode:
        type: choice
        options: [rehearse, install]
        required: true
      confirmation:
        description: REHEARSE_APPLICATION_DEFAULTS or INSTALL_APPLICATION_DEFAULTS
        required: true
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && ((inputs.mode == 'rehearse' && inputs.confirmation == 'REHEARSE_APPLICATION_DEFAULTS') || (inputs.mode == 'install' && inputs.confirmation == 'INSTALL_APPLICATION_DEFAULTS'))
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}
  release:
    name: Repair application defaults; managed defaults remain separate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CI: true
      SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_DEFAULT_PRIVILEGE_CONFIRM: ${{ inputs.confirmation }}
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
      SAFEBUS_BACKUP_PUBLIC_KEY: ${{ vars.SAFEBUS_BACKUP_PUBLIC_KEY }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile, rehearse forward and inverse, then capture encrypted recovery
        id: prepare
        run: node scripts/release-application-default-privileges.mjs prepare
      - name: Retain recovery before persistent installation
        if: steps.prepare.outputs.state == 'pending'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: application-default-recovery-${{ inputs.git_ref }}-${{ github.run_id }}
          path: .safebus-release/application-default-privileges/
          retention-days: 90
          if-no-files-found: error
      - name: Install application-owned future defaults only
        if: inputs.mode == 'install' && steps.prepare.outputs.state == 'pending'
        run: node scripts/release-application-default-privileges.mjs install
      - name: Verify application repair and report remaining managed findings
        if: inputs.mode == 'install'
        run: node scripts/release-application-default-privileges.mjs verify
      - name: Retain sanitized outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: application-default-outcome-${{ inputs.git_ref }}-${{ github.run_id }}
          path: |
            .safebus-release/application-default-privileges/installation.json
            .safebus-release/application-default-privileges/verification.json
            .safebus-release/application-default-privileges/existing.json
          retention-days: 90
          if-no-files-found: ignore
