name: Inspect Postgres upgrade readiness
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed current main commit SHA
        required: true
      confirmation:
        description: Type INSPECT_POSTGRES_UPGRADE
        required: true
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'INSPECT_POSTGRES_UPGRADE'
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}
  inspect:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CI: true
      SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_UPGRADE_CONFIRM: ${{ inputs.confirmation }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect provider upgrade eligibility without changing the project
        run: node scripts/inspect-postgres-upgrade.mjs
      - name: Retain sanitized upgrade prerequisites
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: postgres-upgrade-preflight-${{ inputs.git_ref }}-${{ github.run_id }}
          path: .safebus-release/postgres-upgrade/preflight.json
          retention-days: 90
          if-no-files-found: error
