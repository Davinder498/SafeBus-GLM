name: Run isolated recovery capacity
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full reviewed current main SHA
        required: true
      buses:
        description: Fleet size; 5000 requires Android GPS
        type: choice
        options: ['10', '100', '500', '5000']
        default: '10'
        required: true
      workload:
        description: Normal Android GPS or Recovery-only HTTPS A-B-A (10 or 100 buses)
        type: choice
        options: [combined, android_gps, android_gps_compare, android_gps_restore]
        default: combined
        required: true
      confirmation:
        description: RUN_RECOVERY_GPS_COMPARE_100 for 100-bus A-B-A; other confirmations unchanged
        required: true
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((inputs.buses != '5000' && inputs.workload != 'android_gps_compare' && inputs.workload != 'android_gps_restore' && inputs.confirmation == 'RUN_RECOVERY_CAPACITY') ||
      (inputs.buses == '10' && inputs.workload == 'android_gps_compare' && inputs.confirmation == 'RUN_RECOVERY_GPS_COMPARE') ||
      (inputs.buses == '100' && inputs.workload == 'android_gps_compare' && inputs.confirmation == 'RUN_RECOVERY_GPS_COMPARE_100') ||
      (inputs.buses == '10' && inputs.workload == 'android_gps_restore' && inputs.confirmation == 'RESTORE_RECOVERY_GPS_BASELINE') ||
      (inputs.buses == '5000' && inputs.workload == 'android_gps' && inputs.confirmation == 'RUN_RECOVERY_CAPACITY_5000'))
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}
  install:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.buses == '5000' && 210 || (inputs.buses == '100' && inputs.workload == 'android_gps_compare' && 65) || 45 }}
    environment: production
    steps:
      - name: Verify exact main revision
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run bounded Recovery workload
        if: inputs.workload != 'android_gps_restore'
        env:
          SAFEBUS_CAPACITY_BUSES: ${{ inputs.buses }}
          SAFEBUS_CAPACITY_WORKLOAD: ${{ inputs.workload }}
          SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
          SAFEBUS_CAPACITY_CONFIRM: ${{ inputs.confirmation }}
          SAFEBUS_CAPACITY_DATABASE_URL: ${{ secrets.SAFEBUS_CAPACITY_DATABASE_URL }}
          SAFEBUS_CAPACITY_AUTH_SECRET: ${{ secrets.SAFEBUS_CAPACITY_AUTH_SECRET }}
          SAFEBUS_CAPACITY_PUBLISHABLE_KEY: ${{ vars.SAFEBUS_CAPACITY_PUBLISHABLE_KEY }}
          SAFEBUS_CAPACITY_DATABASE_CA_CERT: ${{ vars.SAFEBUS_CAPACITY_DATABASE_CA_CERT }}
        run: node scripts/run-recovery-capacity.mjs
      - name: Restore only the reviewed GPS function on Recovery
        if: inputs.workload == 'android_gps_restore'
        env:
          SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
          SAFEBUS_CAPACITY_WORKLOAD: ${{ inputs.workload }}
          SAFEBUS_CAPACITY_CONFIRM: ${{ inputs.confirmation }}
          SAFEBUS_CAPACITY_DATABASE_URL: ${{ secrets.SAFEBUS_CAPACITY_DATABASE_URL }}
          SAFEBUS_CAPACITY_DATABASE_CA_CERT: ${{ vars.SAFEBUS_CAPACITY_DATABASE_CA_CERT }}
        run: node scripts/restore-recovery-native-gps.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recovery-capacity-${{ github.run_id }}
          path: .safebus-release/recovery-capacity/evidence.json
          retention-days: 7
          if-no-files-found: error
