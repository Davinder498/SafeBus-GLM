name: Install reviewed existing-project security fixes

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character reviewed current main commit SHA
        required: true
      confirmation:
        description: Type INSTALL_EXISTING_SECURITY_0123_0122_0124
        required: true
      backup_run_id:
        description: Successful encrypted backup workflow run ID (less than 24 hours old)
        required: true
      rehearsal_run_id:
        description: Successful matching rollback rehearsal run ID
        required: true
      recovery_receipt_sha256:
        description: Reviewed SHA256 from the human-verified recovery receipt
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'INSTALL_EXISTING_SECURITY_0123_0122_0124'
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}

  install:
    needs: validate
    name: Protected recovery-gated atomic installation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CI: true
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DEPLOY_ENV: production
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SAFEBUS_REHEARSAL_API_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SAFEBUS_DATABASE_CA_CERT: ${{ vars.SAFEBUS_DATABASE_CA_CERT }}
      SAFEBUS_INSTALL_CONFIRM: ${{ inputs.confirmation }}
      SAFEBUS_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      SAFEBUS_REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
      SAFEBUS_RECOVERY_RECEIPT_SHA256: ${{ inputs.recovery_receipt_sha256 }}
      SAFEBUS_SECURITY_RECOVERY_RECEIPT: ${{ secrets.SAFEBUS_SECURITY_RECOVERY_RECEIPT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate reviewed SHA syntax before checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Require exact reviewed checkout
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          git merge-base --is-ancestor "$ACTUAL_SHA" origin/main
          echo "SAFEBUS_RELEASE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require verified recovery and rehearse again before atomic commit
        run: node scripts/install-existing-security.mjs
      - name: Retain installation outcome evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: existing-security-install-${{ env.SAFEBUS_RELEASE_SHA }}
          path: .safebus-release/existing-security-install/
          retention-days: 90
          if-no-files-found: ignore
