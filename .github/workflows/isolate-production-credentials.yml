name: Isolate production credentials from previews and builds
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed current main SHA
        required: true
      confirmation:
        description: ISOLATE_PRODUCTION_CREDENTIALS (retire unpublished previews; preserve production values)
        required: true
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'ISOLATE_PRODUCTION_CREDENTIALS'
    uses: ./.github/workflows/validate-security-install.yml
    with:
      git_ref: ${{ inputs.git_ref }}
  isolate:
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAFEBUS_RELEASE_SHA: ${{ inputs.git_ref }}
      SAFEBUS_DEPLOY_ENV: production
      SAFEBUS_ISOLATION_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare exact configuration plan and encrypted recovery
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SAFEBUS_BACKUP_PUBLIC_KEY: ${{ vars.SAFEBUS_BACKUP_PUBLIC_KEY }}
        run: node scripts/release-production-credential-isolation.mjs prepare
      - name: Retain encrypted recovery before changing credentials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-credential-recovery-${{ inputs.git_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .safebus-release/production-credential-isolation/
          retention-days: 30
          if-no-files-found: error
      - name: Isolate credentials and retire existing unpublished previews
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/release-production-credential-isolation.mjs install
      - name: Verify isolation and preview retirement
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/release-production-credential-isolation.mjs verify
      - name: Retain sanitized outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-credential-outcome-${{ inputs.git_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .safebus-release/production-credential-isolation/plan.json
            .safebus-release/production-credential-isolation/progress.jsonl
            .safebus-release/production-credential-isolation/installation.json
            .safebus-release/production-credential-isolation/verification.json
          retention-days: 90
          if-no-files-found: ignore
