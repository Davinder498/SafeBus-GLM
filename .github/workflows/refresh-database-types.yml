name: Refresh database types

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch that should receive the generated-types PR
        required: true
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate types read-only from production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_branch }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:generate
      - name: Create reviewable generated-types pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- packages/types/src/database.generated.ts; then
            echo "Database types are already current."
            exit 0
          fi
          branch="automation/database-types-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/types/src/database.generated.ts
          git commit -m "chore: refresh authoritative database types"
          git push origin "$branch"
          gh pr create --draft --base "${{ inputs.base_branch }}" --head "$branch" \
            --title "chore: refresh authoritative database types" \
            --body "Generated read-only from the protected hosted Supabase schema. Review the complete type diff before merge."
