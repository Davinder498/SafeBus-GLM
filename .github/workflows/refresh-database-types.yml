name: Refresh database types

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch that should receive the generated-types PR
        required: true
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate types read-only from production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_branch }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:generate
      - name: Publish generated types for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          if git diff --quiet -- packages/types/src/database.generated.ts; then
            echo "Database types are already current."
            exit 0
          fi
          branch="automation/database-types-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/types/src/database.generated.ts
          git commit -m "chore: refresh authoritative database types"
          git push origin "$branch"
          pr_log="$RUNNER_TEMP/database-types-pr.log"
          if gh pr create --draft --base "$BASE_BRANCH" --head "$branch" \
            --title "chore: refresh authoritative database types" \
            --body "Generated read-only from the protected hosted Supabase schema. Review the complete type diff before merge." > "$pr_log" 2>&1; then
            cat "$pr_log"
            {
              echo "### Generated types ready for review"
              cat "$pr_log"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$(cat "$pr_log")" == *"GitHub Actions is not permitted to create or approve pull requests"* ]]; then
            echo "::warning::Types were generated and pushed. Repository policy requires opening the pull request with a permitted account."
            {
              echo "### Generated types saved; pull request still required"
              echo "Branch: \`$branch\`"
              echo "[Open a pull request](https://github.com/$GITHUB_REPOSITORY/compare/$BASE_BRANCH...$branch?expand=1)"
              echo "The GitHub Actions token cannot create pull requests under the repository's current policy."
              echo "No pull request was created by this run. Human review and merge are still required."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$pr_log"
            exit 1
          fi
