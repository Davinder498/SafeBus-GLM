name: Refresh database types

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch that should receive the generated-types PR
        required: true
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate types from staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:generate
      - name: Create reviewable generated-types pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- packages/types/src/database.generated.ts; then
            echo "Database types are already current."
            exit 0
          fi
          branch="automation/database-types-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/types/src/database.generated.ts
          git commit -m "chore: refresh authoritative database types"
          git push origin "$branch"
          gh pr create --draft --base "${{ inputs.base_branch }}" --head "$branch" \
            --title "chore: refresh authoritative database types" \
            --body "Generated by the pinned Supabase CLI from the protected staging schema. Review the complete type diff before merge."
