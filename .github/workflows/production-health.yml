name: Production health monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Public production health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SAFEBUS_MONITOR_ORIGIN: https://safebus.kids
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Check public production health
        id: public_health
        run: node scripts/check-production-health.mjs
      - name: Record monitoring failure without response content
        if: failure() && steps.public_health.outcome == 'failure'
        run: |
          echo "::error::SafeBus public health failed. Inspect the bounded check results; do not publish provider responses or credentials."
          echo "Public health failed. Follow docs/operations/monitoring-reliability-2026-11-05.md." >> "$GITHUB_STEP_SUMMARY"
