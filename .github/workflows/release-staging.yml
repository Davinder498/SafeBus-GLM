name: Release staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Reviewed commit SHA or tag to release
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  release:
    name: Reproducible staging release
    runs-on: ubuntu-latest
    environment: staging
    env:
      CI: true
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DEPLOY_ENV: staging
      SAFEBUS_DEPLOY_CONFIRM: DEPLOY_STAGING
      SAFEBUS_RELEASE_SHA: ${{ github.sha }}
      SAFEBUS_RLS_TEST_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_RLS_TEST_CONFIRM: DEV_ONLY
      SAFEBUS_RLS_TARGET: staging
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - name: Resolve reviewed release SHA
        run: echo "SAFEBUS_RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release gates
        run: |
          pnpm migrations:verify
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm security:audit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke:release
      - name: Deploy reviewed schema migrations
        run: pnpm migrations:deploy
      - name: Execute RLS assertions on staging
        run: pnpm test:rls
      - name: Verify generated types against staging
        run: pnpm types:check
      - name: Build immutable application artifact
        run: pnpm build
      - name: Reject public source maps
        run: test -z "$(find apps -path '*/dist/*' -name '*.map' -print -quit)"
      - name: Deploy separate staging site
        run: pnpm exec netlify deploy --prod --dir apps/web/dist --message "$SAFEBUS_RELEASE_SHA"
      - name: Store release evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ env.SAFEBUS_RELEASE_SHA }}
          path: |
            apps/web/dist
            supabase/migration-checksums.json
            packages/types/src/database.generated.ts
          retention-days: 30
