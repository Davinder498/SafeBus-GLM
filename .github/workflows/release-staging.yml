name: Release staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character reviewed commit SHA
        required: true

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  release:
    name: Reproducible staging release
    runs-on: ubuntu-latest
    environment: staging
    env:
      CI: true
      SAFEBUS_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_DEPLOY_ENV: staging
      SAFEBUS_DEPLOY_CONFIRM: DEPLOY_STAGING
      SAFEBUS_RLS_TEST_DATABASE_URL: ${{ secrets.SAFEBUS_DATABASE_URL }}
      SAFEBUS_RLS_TEST_CONFIRM: DEV_ONLY
      SAFEBUS_RLS_TARGET: staging
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
      - name: Resolve reviewed release SHA
        env:
          REQUESTED_SHA: ${{ inputs.git_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$ACTUAL_SHA"
          echo "SAFEBUS_RELEASE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Preflight exact commit without changing the database
        run: pnpm release:preflight
      - name: Deploy reviewed schema migrations
        run: pnpm migrations:deploy
      - name: Execute RLS assertions on staging
        run: pnpm test:rls
      - name: Deploy the preflighted staging artifact
        run: pnpm exec netlify deploy --prod --dir apps/web/dist --message "$SAFEBUS_RELEASE_SHA"
      - name: Store release evidence
        uses: actions/upload-artifact@v7
        with:
          name: staging-release-${{ env.SAFEBUS_RELEASE_SHA }}
          path: |
            apps/web/dist
            .safebus-release/preflight.json
            supabase/migration-checksums.json
            packages/types/src/database.generated.ts
          retention-days: 30
