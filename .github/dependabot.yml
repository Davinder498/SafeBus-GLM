version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Edmonton
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: [dependencies, security]
    groups:
      safe-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is not yet supported by the published typescript-eslint
      # toolchain. Upgrade it only through a reviewed compatibility migration.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Capacitor core, CLI, Android, and plugins must remain on one major.
      # Major upgrades require native sync/build validation as a single change.
      - dependency-name: '@capacitor/*'
        update-types: [version-update:semver-major]
      # Vite, its React plugin, and Vitest share internal APIs and peer ranges.
      # Upgrade these majors together through one reviewed toolchain change.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: America/Edmonton
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    groups:
      codeql-actions:
        patterns:
          - 'github/codeql-action/*'
