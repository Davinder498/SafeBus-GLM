apply plugin: 'com.android.application'

def hasReleaseSigning = [
    'SAFEBUS_ANDROID_KEYSTORE_PATH',
    'SAFEBUS_ANDROID_KEYSTORE_PASSWORD',
    'SAFEBUS_ANDROID_KEY_ALIAS',
    'SAFEBUS_ANDROID_KEY_PASSWORD'
].every { System.getenv(it) }
def requireReleaseSigning = System.getenv('SAFEBUS_REQUIRE_RELEASE_SIGNING') == 'true'
def safeBusVersionCode = (System.getenv('SAFEBUS_ANDROID_VERSION_CODE') ?: '1').toInteger()
def safeBusVersionName = System.getenv('SAFEBUS_ANDROID_VERSION_NAME') ?: '1.0.0-dev'
def releaseGpsRoute = providers.gradleProperty('safeBusReleaseGpsRoute').getOrElse('rpc')
if (!(releaseGpsRoute in ['rpc', 'recovery-batch', 'bussafe-batch'])) {
    throw new GradleException('Unknown SafeBus release GPS route.')
}
if (requireReleaseSigning && releaseGpsRoute == 'recovery-batch') {
    throw new GradleException('Recovery GPS cannot be selected for a published release.')
}

if (requireReleaseSigning && !hasReleaseSigning) {
    throw new GradleException('Android release signing is required, but one or more signing variables are missing.')
}

android {
    namespace "com.safebusalberta.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField "String", "GPS_ROUTE", '"rpc"'
        applicationId "com.safebusalberta.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode safeBusVersionCode
        versionName safeBusVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(System.getenv('SAFEBUS_ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('SAFEBUS_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SAFEBUS_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('SAFEBUS_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "GPS_ROUTE",
                project.findProperty('safeBusBatchGpsReceiver') == 'true' ? '"recovery-batch"' : '"rpc"'
        }
        release {
            buildConfigField "String", "GPS_ROUTE", '"' + releaseGpsRoute + '"'
            if (releaseGpsRoute == 'recovery-batch') {
                applicationIdSuffix '.qualification'
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning && releaseGpsRoute != 'recovery-batch') {
                signingConfig signingConfigs.release
            }
        }
    }
}

if (releaseGpsRoute == 'recovery-batch') {
    def verifyRecoveryBundle = tasks.register('verifyRecoveryGpsBundle') {
        doLast {
            def scripts = fileTree('src/main/assets/public/assets') { include '**/*.js' }
            def hasRecovery = false
            scripts.each { script ->
                def content = script.getText('UTF-8')
                if (content.contains('https://ckrkfylsyihwouvesypm.supabase.co')) {
                    throw new GradleException('Recovery qualification includes a production web bundle.')
                }
                if (content.contains('https://deladookciebwvqojhkv.supabase.co')) hasRecovery = true
            }
            def firebaseFiles = fileTree(projectDir) {
                include 'google-services.json', 'src/**/google-services.json'
            }
            if (!hasRecovery || !firebaseFiles.isEmpty()) {
                throw new GradleException('Qualification requires synced Recovery assets and a checkout without Firebase configuration.')
            }
        }
    }
    tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn verifyRecoveryBundle }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
