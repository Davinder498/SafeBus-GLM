<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">BusSafe Alberta</title>
  <description id="description">A friendly yellow school bus on a white panel over a dotted navy tile.</description>
  <defs>
    <pattern id="dots" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="6" fill="#6B7680" opacity="0.42"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7E8E7"/>
      <stop offset="0.2" stop-color="#FAFAF7"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4C23D"/>
      <stop offset="1" stop-color="#FFCD43"/>
    </linearGradient>
    <filter id="panel-shadow" x="-20%" y="-10%" width="140%" height="125%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="bus-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#122536" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="96" fill="#171D23"/>
  <rect width="1024" height="1024" rx="96" fill="url(#dots)"/>
  <rect x="132" y="34" width="760" height="912" rx="54" fill="url(#panel)" filter="url(#panel-shadow)"/>
