    <rect x="532" y="280" width="160" height="159" rx="24" fill="#102D43"/>
    <path d="m467 295-55 128h-53l56-128h52Z" fill="#FFFFFF" opacity="0.22"/>
    <path d="m667 295-55 128h-53l56-128h52Z" fill="#FFFFFF" opacity="0.22"/>
