[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.9.0"

[functions]
  directory = "apps/web/netlify/functions"

# Phase 15B: Conservative hourly scheduled invocation of the secured guardian notification dispatcher.
# Overlapping executions are safe because the database claim RPC uses `for update skip locked`.
# Secrets remain server-side; no browser user is required. Manual secure POST invocation
# to /.netlify/functions/guardian-notification-email remains available for QA.
[functions."guardian-notification-email-scheduled"]
  schedule = "@hourly"

# Phase 3: daily retention orchestration. The function defaults to dry-run;
# SAFEBUS_RETENTION_EXECUTE=true is set only after counsel approves the periods.
[functions."safebus-retention-scheduled"]
  schedule = "@daily"

# Phase 5: Keep invitation lifecycle state current and block stale invited
# profiles independently of email-provider link expiry.
[functions."safebus-invitation-expiry-scheduled"]
  schedule = "@hourly"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), browsing-topics=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
